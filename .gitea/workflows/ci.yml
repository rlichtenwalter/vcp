name: CI

on:
  push:
    branches: [develop, main]
  pull_request:
    branches: [develop, main]

# Cancel older runs for the same ref when a new push/PR event arrives.
# Saves CI cycles on rapid re-pushes.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        build_type: [Release, Debug]
    steps:
      - uses: actions/checkout@v4

      - name: Install Boost headers
        run: |
          sudo apt-get update
          sudo apt-get install -y libboost-dev

      - name: Configure
        run: cmake -B build -DCMAKE_BUILD_TYPE=${{ matrix.build_type }}

      - name: Build
        run: cmake --build build

      - name: Test
        run: ctest --test-dir build --output-on-failure

  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install uv + pre-commit
        run: |
          curl -LsSf https://astral.sh/uv/install.sh | sh
          echo "$HOME/.local/bin" >> $GITHUB_PATH

      - name: Run pre-commit (commit stage)
        run: uvx --with pre-commit==4.5.1 pre-commit run --all-files --hook-stage pre-commit
        env:
          SKIP: no-commit-to-branch

      - name: Run pre-commit (push stage)
        run: uvx --with pre-commit==4.5.1 pre-commit run --all-files --hook-stage pre-push
        env:
          SKIP: no-commit-to-branch

  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Boost headers and clang-tidy
        run: |
          sudo apt-get update
          sudo apt-get install -y libboost-dev
          pip install clang-tidy==20.1.0

      - name: Configure (for compile_commands.json)
        run: cmake -B build -DCMAKE_EXPORT_COMPILE_COMMANDS=ON

      - name: Run clang-tidy
        run: clang-tidy -p build include/vcp/*.hpp tools/*.cpp test/*.cpp
